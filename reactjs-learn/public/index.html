<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500|Roboto:300,400,500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <title>30 Days Of React App</title>
    <style>
      /* General style */

      *{
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      html,
      body{
        height: 100%;
        line-height: 1.5;
        font-family: 'Montserrat';
        font-weight: 300;
        color: black;
      }

      .root{
        min-height: 100%;
        position: relative;
      }

      h1{
        text-align: center;
        margin-top: 20px;
      }

      img{
        width: 20%;
        height: 20%;
        
      }

      .images{
        margin-top: 30px;
        display: flex;
        justify-content: center;
        gap: 20px;
      }

      p{
        text-align: center;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        font-size: 18px;
      }

      .form{
        display: flex;
        justify-content: center;
      }

      .form .input{
        padding: 8px;
        margin: 6px;
        border-radius: 5%;
      }

      .btn{
        
        background: brown;
        padding: 5px;
        width: 200px;
        border-radius: 5%;
        border-style: double;
        color: bisque;
        font-size: 20px;
      }

      .main-wrapper{
        /* display: flex; */
        justify-content: center;
        align-items: center;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
